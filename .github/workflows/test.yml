name: Test

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      FPC_WINDOWS_UNIT_PATH: 'C:\tools\freepascal\units\i386-win32\*'
      TZ: ${{ matrix.timezone }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            timezone: Eastern Standard Time
          - name: Linux
            os: ubuntu-latest
            timezone: America/New_York

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Free Pascal on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install freepascal --version=3.2.2 --yes --no-progress
          $compiler = Get-ChildItem 'C:\tools\freepascal' -Recurse -Filter fpc.exe -ErrorAction Stop |
            Select-Object -First 1
          if ($null -eq $compiler) {
            throw 'Free Pascal compiler was not installed.'
          }
          Split-Path $compiler.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set Windows test timezone
        if: runner.os == 'Windows'
        shell: pwsh
        run: tzutil /s '${{ matrix.timezone }}'

      - name: Install Free Pascal on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes fpc

      - name: Show compiler version
        run: fpc -iV

      - name: Compile and run tests on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: tests
        run: |
          fpc "-FU." "-Fu$env:FPC_WINDOWS_UNIT_PATH" "-Fu$env:GITHUB_WORKSPACE\src" TestRunner.lpr
          .\TestRunner.exe -a --format=plain

      - name: Compile and run tests on Linux
        if: runner.os == 'Linux'
        working-directory: tests
        run: |
          fpc "-FU." "-Fu$GITHUB_WORKSPACE/src" TestRunner.lpr
          ./TestRunner -a --format=plain

      - name: Compile examples on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem examples -Recurse -File -Include *.lpr,*.pas |
            ForEach-Object {
              fpc "-FU$env:GITHUB_WORKSPACE\tests" "-Fu$env:FPC_WINDOWS_UNIT_PATH" "-Fu$env:GITHUB_WORKSPACE\src" $_.FullName
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }

      - name: Compile examples on Linux
        if: runner.os == 'Linux'
        run: |
          find examples -type f \( -name '*.lpr' -o -name '*.pas' \) -print0 |
            xargs -0 -n1 fpc "-FU$GITHUB_WORKSPACE/tests" "-Fu$GITHUB_WORKSPACE/src"
