name: Test

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      FPC_WINDOWS_UNIT_PATH: 'C:\tools\freepascal\units\i386-win32\*'
      TZ: ${{ matrix.timezone }}
      CHRONOKIT_TEST_NEW_YORK: ${{ matrix.new_york }}
      CHRONOKIT_TEST_LONDON: ${{ matrix.london }}
      CHRONOKIT_TEST_SYDNEY: ${{ matrix.sydney }}
      CHRONOKIT_TEST_TOKYO: ${{ matrix.tokyo }}
      CHRONOKIT_TEST_AUCKLAND: ${{ matrix.auckland }}
      CHRONOKIT_TEST_SYSTEM_GAP: ${{ matrix.system_gap }}
      CHRONOKIT_TEST_SYSTEM_OVERLAP: ${{ matrix.system_overlap }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            timezone: Eastern Standard Time
            new_york: Eastern Standard Time
            london: GMT Standard Time
            sydney: AUS Eastern Standard Time
            tokyo: Tokyo Standard Time
            auckland: New Zealand Standard Time
            system_gap: '2024-03-10 02:30:00'
            system_overlap: '2024-11-03 01:30:00'
          - name: Linux
            os: ubuntu-latest
            timezone: America/New_York
            new_york: America/New_York
            london: Europe/London
            sydney: Australia/Sydney
            tokyo: Asia/Tokyo
            auckland: Pacific/Auckland
            system_gap: '2024-03-10 02:30:00'
            system_overlap: '2024-11-03 01:30:00'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Free Pascal on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install freepascal --version=3.2.2 --yes --no-progress
          $compiler = Get-ChildItem 'C:\tools\freepascal' -Recurse -Filter fpc.exe -ErrorAction Stop |
            Select-Object -First 1
          if ($null -eq $compiler) {
            throw 'Free Pascal compiler was not installed.'
          }
          Split-Path $compiler.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set Windows test timezone
        if: runner.os == 'Windows'
        shell: pwsh
        run: tzutil /s '${{ matrix.timezone }}'

      - name: Install Free Pascal on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes fpc

      - name: Show compiler version
        run: fpc -iV

      - name: Compile and run tests on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: tests
        run: |
          $output = "$env:GITHUB_WORKSPACE\build-temp\ci-tests"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          fpc "-FU$output" "-FE$output" "-Fu$env:FPC_WINDOWS_UNIT_PATH" "-Fu$env:GITHUB_WORKSPACE\src" TestRunner.lpr
          & "$output\TestRunner.exe" -a --format=plain

      - name: Compile and run tests on Linux
        if: runner.os == 'Linux'
        working-directory: tests
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build-temp/ci-tests"
          fpc "-FU$GITHUB_WORKSPACE/build-temp/ci-tests" "-FE$GITHUB_WORKSPACE/build-temp/ci-tests" "-Fu$GITHUB_WORKSPACE/src" TestRunner.lpr
          "$GITHUB_WORKSPACE/build-temp/ci-tests/TestRunner" -a --format=plain

      - name: Compile legacy compatibility fixture on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: tests
        run: |
          $output = "$env:GITHUB_WORKSPACE\build-temp\ci-legacy"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          fpc -B -vw "-FU$output" "-FE$output" "-Fu$env:FPC_WINDOWS_UNIT_PATH" "-Fu$env:GITHUB_WORKSPACE\src" LegacyCompatibility.pas

      - name: Compile legacy compatibility fixture on Linux
        if: runner.os == 'Linux'
        working-directory: tests
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build-temp/ci-legacy"
          fpc -B -vw "-FU$GITHUB_WORKSPACE/build-temp/ci-legacy" "-FE$GITHUB_WORKSPACE/build-temp/ci-legacy" "-Fu$GITHUB_WORKSPACE/src" LegacyCompatibility.pas

      - name: Compile examples on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = "$env:GITHUB_WORKSPACE\build-temp\ci-examples"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          Get-ChildItem examples -Recurse -File -Include *.lpr,*.pas |
            ForEach-Object {
              fpc "-FU$output" "-FE$output" "-Fu$env:FPC_WINDOWS_UNIT_PATH" "-Fu$env:GITHUB_WORKSPACE\src" $_.FullName
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }

      - name: Compile examples on Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build-temp/ci-examples"
          find examples -type f \( -name '*.lpr' -o -name '*.pas' \) -print0 |
            xargs -0 -n1 fpc "-FU$GITHUB_WORKSPACE/build-temp/ci-examples" "-FE$GITHUB_WORKSPACE/build-temp/ci-examples" "-Fu$GITHUB_WORKSPACE/src"

      - name: Run executable learning path on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem examples\LearningPath -Filter *.lpr -File |
            ForEach-Object {
              & "$env:GITHUB_WORKSPACE\build-temp\ci-examples\$($_.BaseName).exe"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }

      - name: Run executable learning path on Linux
        if: runner.os == 'Linux'
        run: |
          find examples/LearningPath -type f -name '*.lpr' -print0 |
            while IFS= read -r -d '' source; do
              name="$(basename "${source%.*}")"
              "$GITHUB_WORKSPACE/build-temp/ci-examples/$name"
            done

      - name: Check generated reference and executable documentation
        shell: pwsh
        run: pwsh -NoProfile -File tools\TestDocumentation.ps1

      - name: Verify clean consumer installation paths
        shell: pwsh
        run: pwsh -NoProfile -File tools\TestCleanConsumers.ps1

  documentation-checks:
    name: Documentation and release metadata checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run documentation builder tests
        run: |
          python3 tools/test_build_docs.py
          python3 tools/test_build_all_docs.py
          python3 tools/test_check_built_docs.py
          python3 tools/test_check_docs.py
          python3 tools/check_docs.py

      - name: Run release metadata validation in pre-tag mode
        run: python3 tools/check_release.py --pre-tag
